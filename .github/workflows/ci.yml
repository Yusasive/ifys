name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ify
          POSTGRES_PASSWORD: ify_dev_password
          POSTGRES_DB: ify_summit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ify -d ify_summit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ify:ify_dev_password@localhost:5432/ify_summit?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: ify-summit-uploads
      S3_ACCESS_KEY_ID: ify_minio
      S3_SECRET_ACCESS_KEY: ify_minio_password
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGIN: http://localhost:3001
      FRONTEND_ORIGIN: http://localhost:3001
      EVENT_SLUG: ify-summit-2026
      # CI-only fake secrets — the webhook tests stub the Flutterwave verify
      # call rather than hitting the real API.
      FLUTTERWAVE_SECRET_KEY: FLWSECK_TEST-ci_fake_secret_not_a_real_key-X
      FLUTTERWAVE_PUBLIC_KEY: FLWPUBK_TEST-ci_fake_key_not_a_real_key-X
      FLUTTERWAVE_WEBHOOK_HASH: ci_fake_webhook_hash_not_a_real_secret
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: tickets@ifysummit.ng
      SUPPORT_EMAIL: support@ifysummit.ng
      # CI-only fake secret — not used to sign anything real.
      JWT_SECRET: ci_fake_jwt_secret_not_a_real_secret_0123456789abcdef
      JWT_EXPIRES_IN: "28800"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm run typecheck --workspace backend
      - run: npm run lint --workspace backend
      - run: npm run test --workspace backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace frontend
      - run: npm run lint --workspace frontend
      - run: npm run build --workspace frontend
